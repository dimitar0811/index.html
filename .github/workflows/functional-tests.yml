name: Functional browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = html.match(/<script[^>]*>[\s\S]*?<\/script>/gi) || [];
          const inline = scripts.map(s => s.replace(/^<script[^>]*>/i, '').replace(/<\/script>$/i, '')).filter(s => s.trim());
          if (!inline.length) throw new Error('No inline JavaScript found');
          inline.forEach((source, i) => new vm.Script(source, { filename: 'inline-script-' + (i + 1) + '.js' }));
          console.log('Syntax passed for ' + inline.length + ' inline script(s).');
          NODE
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run functional browser tests
        run: npm test
