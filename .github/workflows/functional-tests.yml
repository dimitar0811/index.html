name: Functional browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functional-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check test JavaScript syntax
        run: node --check tests/functional.spec.cjs && node --check tests/server.cjs && node --check playwright.config.cjs
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run functional browser tests
        run: npm test
        env:
          SUPABASE_TEST_EMAIL: ${{ secrets.SUPABASE_TEST_EMAIL }}
          SUPABASE_TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
          SUPABASE_TEST_EMAIL_B: ${{ secrets.SUPABASE_TEST_EMAIL_B }}
          SUPABASE_TEST_PASSWORD_B: ${{ secrets.SUPABASE_TEST_PASSWORD_B }}
          RUN_LIVE_SUPABASE_TESTS: ${{ vars.RUN_LIVE_SUPABASE_TESTS }}
